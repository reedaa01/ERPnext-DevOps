apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.websocket.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: websocket
{{ include "erpnext.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app: websocket
  ports:
    - name: socketio
      port: {{ .Values.websocket.service.port }}
      targetPort: {{ .Values.websocket.service.port }}
      protocol: TCP
