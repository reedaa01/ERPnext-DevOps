apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erpnext-workload
  namespace: {{ .Release.Namespace }}
  labels:
    app: erpnext-workload
{{ include "erpnext.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: erpnext-workload
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: erpnext-assets-builder
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: erpnext-workload
