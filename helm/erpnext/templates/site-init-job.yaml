apiVersion: batch/v1
kind: Job
metadata:
  name: erpnext-site-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: erpnext-site-init
{{ include "erpnext.labels" . | indent 4 }}
spec:
  backoffLimit: {{ .Values.jobs.siteInit.backoffLimit }}
  template:
    metadata:
      labels:
        app: erpnext-site-init
{{ include "erpnext.labels" . | indent 8 }}
    spec:
      restartPolicy: {{ .Values.jobs.siteInit.restartPolicy }}
      containers:
        - name: site-init
          image: {{ include "erpnext.image" . }}
          command:
            - bash
            - -c
            - |
              set -e

              SITE_NAME="{{ .Values.erpnext.siteName }}"

              if [ -f "sites/${SITE_NAME}/site_config.json" ]; then
                echo "Site ${SITE_NAME} already exists."
                exit 0
              fi

              bench new-site "${SITE_NAME}" \
                --mariadb-root-password "$MARIADB_ROOT_PASSWORD" \
                --admin-password "$ADMIN_PASSWORD" \
                --db-host "$DB_HOST" \
                --db-port "$DB_PORT" \
                --install-app erpnext
          envFrom:
            - configMapRef:
                name: erpnext-config
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: mariadb-root-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: admin-password
          volumeMounts:
            - name: sites
              mountPath: {{ include "erpnext.sitesMountPath" . }}
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: sites
