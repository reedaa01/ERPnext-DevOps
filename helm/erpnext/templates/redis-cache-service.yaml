apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.cache.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-cache
{{ include "erpnext.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app: redis-cache
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      protocol: TCP
