apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erpnext-workload
  namespace: {{ .Release.Namespace }}
  labels:
    app: erpnext-workload
{{ include "erpnext.labels" . | indent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - erpnext-config
    verbs:
      - get
