apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: erpnext-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: erpnext.availability
      rules:

        - alert: ERPNextDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="erpnext-gitops"
            }
            <
            kube_deployment_spec_replicas{
              namespace="erpnext-gitops"
            }
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ERPNext deployment unavailable"
            description: "Deployment {{ $labels.deployment }} has fewer available replicas than expected."

        - alert: ERPNextMariaDBUnavailable
          expr: |
            kube_statefulset_status_replicas_ready{
              namespace="erpnext-gitops",
              statefulset="mariadb"
            } < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ERPNext MariaDB unavailable"
            description: "MariaDB StatefulSet has no ready replica."

        - alert: ERPNextPodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="erpnext-gitops",
              reason="CrashLoopBackOff"
            } > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ERPNext pod CrashLoopBackOff"
            description: "Pod {{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."

        - alert: ERPNextPodRestarting
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="erpnext-gitops"
              }[10m]
            ) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ERPNext pod restarting frequently"
            description: "Pod {{ $labels.pod }} container {{ $labels.container }} restarted at least 3 times in the last 10 minutes."

        - alert: AKSNodeHighCPU
          expr: |
            100 * (
              1 - avg by(instance) (
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              )
            ) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "AKS node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage is above 85% for more than 10 minutes."

        - alert: AKSNodeHighMemory
          expr: |
            100 * (
              1 - node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            ) > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "AKS node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage is above 90% for more than 10 minutes."

        - alert: PersistentVolumeAlmostFull
          expr: |
            100 * (
              1 - kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes
            ) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Persistent volume almost full"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is more than 80% full."
