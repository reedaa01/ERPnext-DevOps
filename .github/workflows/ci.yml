name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('infrastructure/terraform/.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint
        run: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Add Helm repositories
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Pull pinned charts
        run: |
          mkdir -p "${RUNNER_TEMP}/charts"
          helm pull grafana-community/loki --version 18.13.7 --untar --untardir "${RUNNER_TEMP}/charts"
          helm pull prometheus-community/kube-prometheus-stack --version 91.9.0 --untar --untardir "${RUNNER_TEMP}/charts"
          helm pull grafana/alloy --version 1.13.0 --untar --untardir "${RUNNER_TEMP}/charts"

      - name: Helm lint
        run: |
          helm lint helm/erpnext
          helm lint helm/erpnext -f helm/erpnext/values.yaml
          helm lint "${RUNNER_TEMP}/charts/loki" -f helm/observability/loki-values.yaml
          helm lint "${RUNNER_TEMP}/charts/kube-prometheus-stack" -f helm/observability/prometheus-values.yaml
          helm lint "${RUNNER_TEMP}/charts/alloy" -f helm/observability/alloy-values.yaml

      - name: Helm template
        run: |
          mkdir -p "${RUNNER_TEMP}/rendered/erpnext"
          helm template erpnext helm/erpnext -f helm/erpnext/values.yaml --namespace erpnext > "${RUNNER_TEMP}/rendered/erpnext/erpnext.yaml"

          mkdir -p "${RUNNER_TEMP}/rendered/observability"
          helm template loki "${RUNNER_TEMP}/charts/loki" -f helm/observability/loki-values.yaml --namespace monitoring > "${RUNNER_TEMP}/rendered/observability/loki.yaml"
          helm template kube-prometheus-stack "${RUNNER_TEMP}/charts/kube-prometheus-stack" -f helm/observability/prometheus-values.yaml --namespace monitoring > "${RUNNER_TEMP}/rendered/observability/prometheus.yaml"
          helm template alloy "${RUNNER_TEMP}/charts/alloy" -f helm/observability/alloy-values.yaml --namespace monitoring > "${RUNNER_TEMP}/rendered/observability/alloy.yaml"

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    needs: helm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Add Helm repositories
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Pull pinned charts
        run: |
          mkdir -p "${RUNNER_TEMP}/charts"
          helm pull grafana-community/loki --version 18.13.7 --untar --untardir "${RUNNER_TEMP}/charts"
          helm pull prometheus-community/kube-prometheus-stack --version 91.9.0 --untar --untardir "${RUNNER_TEMP}/charts"
          helm pull grafana/alloy --version 1.13.0 --untar --untardir "${RUNNER_TEMP}/charts"

      - name: Render charts for dry-run validation
        run: |
          mkdir -p "${RUNNER_TEMP}/rendered/erpnext"
          helm template erpnext helm/erpnext -f helm/erpnext/values.yaml --namespace erpnext > "${RUNNER_TEMP}/rendered/erpnext/erpnext.yaml"

          mkdir -p "${RUNNER_TEMP}/rendered/observability"
          helm template loki "${RUNNER_TEMP}/charts/loki" -f helm/observability/loki-values.yaml --namespace monitoring > "${RUNNER_TEMP}/rendered/observability/loki.yaml"
          helm template kube-prometheus-stack "${RUNNER_TEMP}/charts/kube-prometheus-stack" -f helm/observability/prometheus-values.yaml --namespace monitoring > "${RUNNER_TEMP}/rendered/observability/prometheus.yaml"
          helm template alloy "${RUNNER_TEMP}/charts/alloy" -f helm/observability/alloy-values.yaml --namespace monitoring > "${RUNNER_TEMP}/rendered/observability/alloy.yaml"

      - name: Kubernetes dry-run validation
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/kubeconfig"
          cat > "${RUNNER_TEMP}/offline-api-server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json
          from urllib.parse import urlparse

          def resource(name, kind, namespaced=True):
            return {
              "name": name,
              "singularName": "",
              "namespaced": namespaced,
              "kind": kind,
              "verbs": ["get", "list", "watch", "create", "update", "patch", "delete"],
            }

          api_resources = {
            "/api/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "v1",
              "resources": [
                resource("namespaces", "Namespace", False),
                resource("serviceaccounts", "ServiceAccount"),
                resource("secrets", "Secret"),
                resource("configmaps", "ConfigMap"),
                resource("services", "Service"),
                resource("persistentvolumeclaims", "PersistentVolumeClaim"),
                resource("pods", "Pod"),
              ],
            },
            "/apis/apps/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "apps/v1",
              "resources": [
                resource("deployments", "Deployment"),
                resource("daemonsets", "DaemonSet"),
                resource("statefulsets", "StatefulSet"),
              ],
            },
            "/apis/batch/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "batch/v1",
              "resources": [
                resource("jobs", "Job"),
              ],
            },
            "/apis/rbac.authorization.k8s.io/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "rbac.authorization.k8s.io/v1",
              "resources": [
                resource("roles", "Role"),
                resource("rolebindings", "RoleBinding"),
                resource("clusterroles", "ClusterRole", False),
                resource("clusterrolebindings", "ClusterRoleBinding", False),
              ],
            },
            "/apis/networking.k8s.io/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "networking.k8s.io/v1",
              "resources": [
                resource("networkpolicies", "NetworkPolicy"),
                resource("ingresses", "Ingress"),
              ],
            },
            "/apis/admissionregistration.k8s.io/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "admissionregistration.k8s.io/v1",
              "resources": [
                resource("mutatingwebhookconfigurations", "MutatingWebhookConfiguration", False),
                resource("validatingwebhookconfigurations", "ValidatingWebhookConfiguration", False),
              ],
            },
            "/apis/monitoring.coreos.com/v1": {
              "kind": "APIResourceList",
              "apiVersion": "v1",
              "groupVersion": "monitoring.coreos.com/v1",
              "resources": [
                resource("prometheuses", "Prometheus"),
                resource("alertmanagers", "Alertmanager"),
                resource("prometheusrules", "PrometheusRule"),
                resource("servicemonitors", "ServiceMonitor"),
              ],
            },
          }

          class Handler(BaseHTTPRequestHandler):
            def _send_json(self, payload):
              body = json.dumps(payload).encode("utf-8")
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

            def do_GET(self):
              path = urlparse(self.path).path
              if path == "/api":
                self._send_json({"kind": "APIVersions", "apiVersion": "v1", "versions": ["v1"], "serverAddressByClientCIDRs": []})
              elif path == "/apis":
                self._send_json({
                  "kind": "APIGroupList",
                  "apiVersion": "v1",
                  "groups": [
                    {"name": "apps", "versions": [{"groupVersion": "apps/v1", "version": "v1"}], "preferredVersion": {"groupVersion": "apps/v1", "version": "v1"}},
                    {"name": "batch", "versions": [{"groupVersion": "batch/v1", "version": "v1"}], "preferredVersion": {"groupVersion": "batch/v1", "version": "v1"}},
                    {"name": "rbac.authorization.k8s.io", "versions": [{"groupVersion": "rbac.authorization.k8s.io/v1", "version": "v1"}], "preferredVersion": {"groupVersion": "rbac.authorization.k8s.io/v1", "version": "v1"}},
                    {"name": "networking.k8s.io", "versions": [{"groupVersion": "networking.k8s.io/v1", "version": "v1"}], "preferredVersion": {"groupVersion": "networking.k8s.io/v1", "version": "v1"}},
                    {"name": "admissionregistration.k8s.io", "versions": [{"groupVersion": "admissionregistration.k8s.io/v1", "version": "v1"}], "preferredVersion": {"groupVersion": "admissionregistration.k8s.io/v1", "version": "v1"}},
                    {"name": "monitoring.coreos.com", "versions": [{"groupVersion": "monitoring.coreos.com/v1", "version": "v1"}], "preferredVersion": {"groupVersion": "monitoring.coreos.com/v1", "version": "v1"}},
                  ],
                })
              elif path in api_resources:
                self._send_json(api_resources[path])
              else:
                self.send_response(404)
                self.end_headers()

            def log_message(self, format, *args):
              return

          ThreadingHTTPServer(("127.0.0.1", 6443), Handler).serve_forever()
          PY
          cat > "${RUNNER_TEMP}/kubeconfig/config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: offline
              cluster:
                server: http://127.0.0.1:6443
          contexts:
            - name: offline
              context:
                cluster: offline
                user: offline
          current-context: offline
          users:
            - name: offline
              user: {}
          EOF
          python3 "${RUNNER_TEMP}/offline-api-server.py" > "${RUNNER_TEMP}/offline-api-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/offline-api-server.pid"

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:6443/api >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Offline API server did not start"
              cat "${RUNNER_TEMP}/offline-api-server.log"
              exit 1
            fi
            sleep 1
          done

          trap 'if [ -f "${RUNNER_TEMP}/offline-api-server.pid" ]; then kill "$(cat "${RUNNER_TEMP}/offline-api-server.pid")" || true; fi' EXIT

          kubectl --kubeconfig "${RUNNER_TEMP}/kubeconfig/config" apply --dry-run=client --validate=false -f "${RUNNER_TEMP}/rendered/erpnext/erpnext.yaml"
          kubectl --kubeconfig "${RUNNER_TEMP}/kubeconfig/config" apply --dry-run=client --validate=false -f "${RUNNER_TEMP}/rendered/observability/loki.yaml"
          kubectl --kubeconfig "${RUNNER_TEMP}/kubeconfig/config" apply --dry-run=client --validate=false -f "${RUNNER_TEMP}/rendered/observability/prometheus.yaml"
          kubectl --kubeconfig "${RUNNER_TEMP}/kubeconfig/config" apply --dry-run=client --validate=false -f "${RUNNER_TEMP}/rendered/observability/alloy.yaml"

          echo "✓ ERPNext manifests validated"
          echo "✓ Loki manifests validated"
          echo "✓ Prometheus manifests validated"
          echo "✓ Alloy manifests validated"

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy filesystem results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif