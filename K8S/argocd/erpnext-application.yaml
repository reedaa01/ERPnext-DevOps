apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/reedaa01/ERPnext-DevOps.git
    targetRevision: main
    path: helm/erpnext
    helm:
      releaseName: erpnext
      valueFiles:
        - values-lab48-keyvault.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: erpnext-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
