apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frappe/erpnext:v16.35.0

          command:
            - nginx-entrypoint.sh

          env:
            - name: BACKEND
              value: backend:8000

            - name: SOCKETIO
              value: websocket:9000

            - name: FRAPPE_SITE_NAME_HEADER
              value: "$host"

            - name: UPSTREAM_REAL_IP_ADDRESS
              value: "127.0.0.1"

            - name: UPSTREAM_REAL_IP_HEADER
              value: "X-Forwarded-For"

            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "off"

            - name: PROXY_READ_TIMEOUT
              value: "120"

            - name: CLIENT_MAX_BODY_SIZE
              value: "50m"

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites

      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: sites
